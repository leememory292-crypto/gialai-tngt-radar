name: Gia Lai TNGT Radar

on:
  schedule:
    # Chạy tự động mỗi 1 giờ
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TNGT Radar script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python radar.py

      - name: Commit and push updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi trong history.json"
          else
            git commit -m "chore: cập nhật lịch sử tin TNGT Gia Lai [skip ci]"
            git push origin HEAD:main
          fi
